<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Masud Rana Nayeem</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon_io/android-chrome-512x512.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<meta name="theme-color" content="#0a0f1e">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center">

<canvas id="bg-canvas"></canvas>
<div id="toast" class="glass-card px-5 py-3 text-sm font-medium"></div>

<div class="glass-card gradient-border p-10 w-full max-w-md mx-4">
  <a href="index.html" class="font-display text-2xl font-bold text-white block text-center mb-8">MRN<span class="text-gradient">.dev</span></a>
  <h1 class="font-display text-2xl text-white text-center mb-1">Admin Login</h1>
  <p class="text-gray-500 text-sm text-center mb-8">Sign in to manage projects, blogs &amp; messages</p>

  <form id="login-form" class="space-y-4">
    <div>
      <label class="text-xs text-gray-400 mb-1 block">Email</label>
      <input name="email" type="email" required placeholder="admin@nayeem.dev" class="w-full glass-card px-4 py-3 text-white placeholder-gray-500 outline-none">
    </div>
    <div>
      <label class="text-xs text-gray-400 mb-1 block">Password</label>
      <input name="password" type="password" required placeholder="••••••••" class="w-full glass-card px-4 py-3 text-white placeholder-gray-500 outline-none">
    </div>
    <button type="submit" class="glow-btn w-full py-3.5 rounded-full font-semibold mt-2">Sign In</button>
  </form>

  <p class="text-center text-xs text-gray-500 mt-6">
    First time? Run <code class="text-cyan-300">npm run seed:admin</code> in the backend to create your admin account.
  </p>
</div>

<script src="assets/js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // If already logged in, skip straight to dashboard
  if (getToken()) window.location.href = 'dashboard.html';

  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const dots = Array.from({ length: 60 }, () => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2 }));
  (function tick(){ ctx.clearRect(0,0,canvas.width,canvas.height); dots.forEach(d=>{ d.x+=d.vx; d.y+=d.vy; if(d.x<0||d.x>canvas.width)d.vx*=-1; if(d.y<0||d.y>canvas.height)d.vy*=-1; ctx.beginPath(); ctx.arc(d.x,d.y,1.4,0,7); ctx.fillStyle='rgba(0,245,255,0.5)'; ctx.fill(); }); requestAnimationFrame(tick); })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await api.login(form.email.value, form.password.value);
      setToken(res.token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showToast(err.message || 'Login failed', 'error');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
});

function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `glass-card px-5 py-3 text-sm font-medium ${type === 'error' ? 'border-red-500/50 text-red-300' : 'text-cyan-200'} show`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
