<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Masud Rana Nayeem</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon_io/android-chrome-512x512.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<meta name="theme-color" content="#0a0f1e">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="min-h-screen">

<div id="toast" class="glass-card px-5 py-3 text-sm font-medium"></div>

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 hidden lg:flex flex-col border-r border-white/5 bg-black/30 backdrop-blur-xl p-6">
    <a href="index.html" class="font-display text-xl font-bold text-white mb-10">MRN<span class="text-gradient">.dev</span></a>
    <nav class="flex flex-col gap-2 text-sm">
      <button data-tab="overview" class="tab-btn text-left px-4 py-3 rounded-xl bg-white/5 text-white"><i class="fas fa-chart-line mr-3 text-cyan-300"></i>Overview</button>
      <button data-tab="projects" class="tab-btn text-left px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white"><i class="fas fa-diagram-project mr-3"></i>Projects</button>
      <button data-tab="certificates" class="tab-btn text-left px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white"><i class="fas fa-award mr-3"></i>Certificates</button>
      <button data-tab="blogs" class="tab-btn text-left px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white"><i class="fas fa-blog mr-3"></i>Blog Posts</button>
      <button data-tab="messages" class="tab-btn text-left px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white"><i class="fas fa-envelope mr-3"></i>Messages</button>
    </nav>
    <button id="logout-btn" class="mt-auto text-left px-4 py-3 rounded-xl text-red-300 hover:bg-red-500/10 text-sm"><i class="fas fa-right-from-bracket mr-3"></i>Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="font-display text-2xl text-white">Dashboard</h1>
        <p class="text-gray-500 text-sm" id="welcome-msg">Welcome back</p>
      </div>
      <div class="lg:hidden">
        <select id="mobile-tab-select" class="glass-card px-4 py-2 text-sm text-white bg-transparent">
          <option value="overview">Overview</option>
          <option value="projects">Projects</option>
          <option value="certificates">Certificates</option>
          <option value="blogs">Blog Posts</option>
          <option value="messages">Messages</option>
        </select>
      </div>
    </div>

    <!-- OVERVIEW -->
    <section id="tab-overview" class="tab-panel">
      <div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-5 mb-8" id="stats-cards"></div>
      <div class="glass-card p-6">
        <h3 class="font-display text-white mb-4">Visitors (last 14 days)</h3>
        <canvas id="visitors-chart" height="90"></canvas>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="tab-projects" class="tab-panel hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-display text-xl text-white">Manage Projects</h2>
        <button id="add-project-btn" class="glow-btn px-5 py-2.5 rounded-full text-sm"><i class="fas fa-plus mr-2"></i>Add Project</button>
      </div>
      <div id="projects-table" class="glass-card p-4 overflow-x-auto"></div>
    </section>

    <!-- CERTIFICATES -->
    <section id="tab-certificates" class="tab-panel hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-display text-xl text-white">Manage Certificates</h2>
        <button id="add-cert-btn" class="glow-btn px-5 py-2.5 rounded-full text-sm"><i class="fas fa-plus mr-2"></i>Add Certificate</button>
      </div>
      <div id="certs-table" class="glass-card p-4 overflow-x-auto"></div>
    </section>

    <!-- BLOGS -->
    <section id="tab-blogs" class="tab-panel hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-display text-xl text-white">Manage Blog Posts</h2>
        <button id="add-blog-btn" class="glow-btn px-5 py-2.5 rounded-full text-sm"><i class="fas fa-plus mr-2"></i>New Post</button>
      </div>
      <div id="blogs-table" class="glass-card p-4 overflow-x-auto"></div>
    </section>

    <!-- MESSAGES -->
    <section id="tab-messages" class="tab-panel hidden">
      <h2 class="font-display text-xl text-white mb-6">Inbox</h2>
      <div id="messages-list" class="space-y-4"></div>
    </section>
  </main>
</div>

<!-- MODAL -->
<div id="modal-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="glass-card gradient-border p-8 w-full max-w-lg max-h-[85vh] overflow-y-auto" id="modal-content"></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
