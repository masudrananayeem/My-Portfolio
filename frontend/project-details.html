<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details | Masud Rana Nayeem</title>
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon_io/android-chrome-512x512.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<meta name="theme-color" content="#0a0f1e">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body class="has-custom-cursor">

<div id="loader"><div class="loader-ring"></div></div>
<canvas id="bg-canvas"></canvas>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<div id="scroll-progress"></div>
<div id="toast" class="glass-card px-5 py-3 text-sm font-medium"></div>

<nav class="navbar fixed top-0 left-0 w-full z-50 py-4">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
    <a href="index.html" class="font-display text-2xl font-bold text-white cursor-hoverable">MRN<span class="text-gradient">.dev</span></a>
    <a href="index.html#projects" class="outline-btn px-5 py-2.5 rounded-full text-sm cursor-hoverable"><i class="fas fa-arrow-left mr-2"></i>Back to Projects</a>
  </div>
</nav>

<main class="pt-32 pb-24 max-w-5xl mx-auto px-6 lg:px-10">
  <div id="project-content">
    <p class="text-gray-500 text-center py-20">Loading project…</p>
  </div>
</main>

<footer class="border-t border-white/5 py-10 text-center text-gray-500 text-sm">
  © 2026 Masud Rana Nayeem. All rights reserved.
</footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/animations.js"></script>
<script>
async function loadProjectDetails() {
  const slug = new URLSearchParams(window.location.search).get('slug');
  const container = document.getElementById('project-content');
  if (!slug) {
    container.innerHTML = `<p class="text-gray-500 text-center py-20">No project specified.</p>`;
    return;
  }
  try {
    const res = await api.getProject(slug);
    const p = res.data;
    document.title = `${p.title} | Nayeem`;
    container.innerHTML = `
      <span class="text-xs text-cyan-300 font-mono">${p.category}</span>
      <h1 class="font-display text-4xl sm:text-5xl font-bold text-white mt-2 mb-6">${p.title}</h1>
      <div class="rounded-2xl overflow-hidden mb-8 gradient-border">
        <img src="${p.image}" alt="${p.title}" class="w-full h-80 object-cover" onerror="this.src='https://placehold.co/1200x600/111827/1E8EB3?text=${encodeURIComponent(p.title)}'">
      </div>
      <div class="flex flex-wrap gap-3 mb-8">
        ${p.githubLink ? `<a href="${p.githubLink}" target="_blank" class="outline-btn px-5 py-2.5 rounded-full text-sm cursor-hoverable"><i class="fab fa-github mr-2"></i>GitHub</a>` : ''}
        ${p.liveLink ? `<a href="${p.liveLink}" target="_blank" class="glow-btn px-5 py-2.5 rounded-full text-sm cursor-hoverable"><i class="fas fa-arrow-up-right-from-square mr-2"></i>Live Demo</a>` : ''}
      </div>
      <div class="glass-card p-8 mb-8">
        <h2 class="font-display text-xl text-white mb-3">Overview</h2>
        <p class="text-gray-400 leading-relaxed">${p.overview || p.description}</p>
      </div>
      ${p.features?.length ? `
      <div class="glass-card p-8 mb-8">
        <h2 class="font-display text-xl text-white mb-4">Key Features</h2>
        <ul class="grid sm:grid-cols-2 gap-3">
          ${p.features.map(f => `<li class="text-sm text-gray-400"><i class="fas fa-check text-cyan-400 mr-2"></i>${f}</li>`).join('')}
        </ul>
      </div>` : ''}
      <div class="glass-card p-8 mb-8">
        <h2 class="font-display text-xl text-white mb-4">Tech Stack</h2>
        <div class="flex flex-wrap gap-2">
          ${p.techStack.map(t => `<span class="text-xs bg-white/5 border border-white/10 px-3 py-1.5 rounded-full text-gray-300">${t}</span>`).join('')}
        </div>
      </div>
      ${p.challenges ? `
      <div class="glass-card p-8 mb-8">
        <h2 class="font-display text-xl text-white mb-3">Challenges &amp; Solutions</h2>
        <p class="text-gray-400 text-sm mb-3"><strong class="text-white">Challenge:</strong> ${p.challenges}</p>
        <p class="text-gray-400 text-sm"><strong class="text-white">Solution:</strong> ${p.solutions}</p>
      </div>` : ''}
    `;
  } catch (err) {
    container.innerHTML = `<p class="text-gray-500 text-center py-20">Project not found, or the API isn't reachable yet.</p>`;
  }
}
document.addEventListener('DOMContentLoaded', loadProjectDetails);
</script>
</body>
</html>
